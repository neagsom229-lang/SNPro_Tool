[supervisord]
nodaemon=true

[program:web]
command=gunicorn run:app --bind 0.0.0.0:%(ENV_PORT)s --workers 1 --threads 4 --timeout 120
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=celery -A celery_worker.celery worker -Q heavy,light --concurrency=%(ENV_CELERY_CONCURRENCY)s --loglevel=info
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:beat]
command=celery -A celery_worker.celery beat --loglevel=info
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0